<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Muro en Vivo — EventPix</title>
    <style>
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh
        }

        #stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center
        }

        img,
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: fadeIn 1s
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .qr-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center
        }

        .qr-overlay img {
            width: 100px;
            height: 100px
        }
    </style>
</head>

<body>
    <div id="stage"></div>

    <div class="qr-overlay">
        <p style="margin:0;color:black;font-family:sans-serif;font-size:12px;margin-bottom:5px">Subí tu foto</p>
        <!-- Placeholder QR, user should replace or generate one -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://app.event-pix.com.ar"
            alt="QR" />
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQW779AzyP8h1XKP0UCbd6G_WQPyYpGyE",
            authDomain: "inta-wa.firebaseapp.com",
            projectId: "inta-wa",
            storageBucket: "inta-wa.firebasestorage.app",
            messagingSenderId: "54916277584",
            appId: "1:54916277584:web:83bfcf7920f54aa123b855",
            measurementId: "G-BHZ33E3QKQ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let photos = [];
        let currentIndex = 0;
        const stage = document.getElementById('stage');

        // Listen for approved photos
        db.collection('submissions').where('approved', '==', true).orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            photos = [];
            snapshot.forEach(doc => {
                photos.push(doc.data());
            });
            if (photos.length > 0 && stage.innerHTML === '') {
                showNext();
            }
        });

        function showNext() {
            if (photos.length === 0) return;

            const photo = photos[currentIndex];
            const url = `https://firebasestorage.googleapis.com/v0/b/${firebaseConfig.storageBucket}/o/${encodeURIComponent(photo.storagePath)}?alt=media`;

            let element;
            if (photo.type === 'video') {
                element = document.createElement('video');
                element.src = url;
                element.autoplay = true;
                element.muted = true;
                element.onended = () => {
                    currentIndex = (currentIndex + 1) % photos.length;
                    showNext();
                };
            } else {
                element = document.createElement('img');
                element.src = url;
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % photos.length;
                    showNext();
                }, 5000); // 5 seconds per photo
            }

            stage.innerHTML = '';
            stage.appendChild(element);
        }
    </script>
</body>

</html>
