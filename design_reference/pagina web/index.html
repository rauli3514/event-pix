<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subí tu foto — Muro</title>
  <style>
    body {
      font-family: Arial, system-ui;
      background: #0f1720;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      max-width: 480px;
      width: 95%
    }

    input,
    textarea {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b1220;
      color: #fff
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #06b6d4;
      color: #042029;
      font-weight: 600;
      cursor: pointer
    }

    small {
      color: #9ca3af
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Compartí una foto o video</h2>
    <small>Subí desde el celular — se mostrará en el muro tras aprobación.</small>
    <input id="name" placeholder="Tu nombre (opcional)" />
    <textarea id="message" rows="3" placeholder="Mensaje (opcional)"></textarea>
    <input id="file" type="file" accept="image/*,video/*" />
    <button id="send">Enviar</button>
    <p id="status"></p>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAQW779AzyP8h1XKP0UCbd6G_WQPyYpGyE",
      authDomain: "inta-wa.firebaseapp.com",
      projectId: "inta-wa",
      storageBucket: "inta-wa.firebasestorage.app",
      messagingSenderId: "54916277584",
      appId: "1:54916277584:web:83bfcf7920f54aa123b855",
      measurementId: "G-BHZ33E3QKQ"
    };
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const db = firebase.firestore();

    const fileInput = document.getElementById('file');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');

    sendBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { status.textContent = 'Seleccioná un archivo.'; return; }
      sendBtn.disabled = true;
      status.textContent = 'Subiendo...';

      try {
        const id = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        const ext = file.name.split('.').pop();
        const storageRef = storage.ref().child('uploads/' + id + '.' + ext);
        const snap = await storageRef.put(file);
        await db.collection('submissions').add({
          storagePath: snap.ref.fullPath,
          type: file.type.startsWith('video') ? 'video' : 'image',
          uploaderName: document.getElementById('name').value || null,
          message: document.getElementById('message').value || null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          approved: false
        });
        status.textContent = 'Gracias! Tu archivo quedó en espera de aprobación.';
      } catch (err) {
        console.error(err);
        status.textContent = 'Error al subir: ' + (err.message || err);
      } finally {
        sendBtn.disabled = false;
        fileInput.value = '';
      }
    });
  </script>
</body>

</html>
