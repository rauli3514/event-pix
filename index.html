<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Las tipografías de Google no frenan el dibujo de la página: se cargan
       aparte (media=print y al llegar pasan a all). Antes la pantalla esperaba
       a Google y, en una TV con el Wi-Fi recién conectado, quedaba en negro
       hasta 2 minutos. Mientras tanto se usa la letra del sistema. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Orbitron:wght@400;700&family=Pinyon+Script&family=Montserrat:wght@400;500;600;700;800;900&family=Anton&family=Bebas+Neue&family=Lobster&family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Orbitron:wght@400;700&family=Pinyon+Script&family=Montserrat:wght@400;500;600;700;800;900&family=Anton&family=Bebas+Neue&family=Lobster&family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet">
  </noscript>
  <script>
    if (typeof globalThis === 'undefined') {
      Object.defineProperty(Object.prototype, 'globalThis', {
        get: function () {
          return this;
        },
        configurable: true
      });
    }
  </script>
  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
  <title>EventPix - Comparte Fotos y Mensajes en Tu Evento Especial</title>
  <meta name="description"
    content="Plataforma interactiva para compartir fotos y mensajes en tiempo real durante eventos especiales. Sistema de moderación incluido para garantizar contenido apropiado.">
  <meta property="og:title" content="EventPix - Comparte Fotos y Mensajes en Tu Evento Especial" />
  <meta property="og:description"
    content="Plataforma interactiva para compartir fotos y mensajes en tiempo real durante eventos especiales." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="author" content="EventPix" />
</head>

<body style="background-color: #000; color: #fff;">
  <div id="root"></div>
  <script>
    // TV (rutas /tv...): si la página no llega a dibujarse, recargar.
    // Pasa cuando la TV arranca sin internet y usa una copia vieja de la página
    // que pide archivos de una versión anterior que ya no existen: quedaba en
    // negro para siempre. Se recarga pidiendo la versión nueva (con ?_r=...
    // para no usar la copia guardada) y se reintenta cada 30 s hasta que ande.
    (function () {
      if (!/^\/tv/.test(location.pathname)) return;
      var KEY = 'tv_boot_reload_at';
      function check() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          try { sessionStorage.removeItem(KEY); } catch (e) {}
          return;
        }
        var last = 0;
        try { last = +(sessionStorage.getItem(KEY) || 0); } catch (e) {}
        if (Date.now() - last < 30000) { setTimeout(check, 10000); return; }
        try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        location.replace(location.pathname + '?_r=' + Date.now() + location.hash);
      }
      setTimeout(check, 20000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
