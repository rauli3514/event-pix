name: APK de EventPix Video

# Genera la app de la cabina de video ("EventPix Video", com.eventpix.video): 360,
# boomerang, cámara lenta, glam y libro de firmas. Es una app aparte del kiosco:
# su propia web (vite.video.config.ts), su propio panel (/admin/cabina-video) y
# sus propias tablas. Sirve en TV box con webcam y en celular o tablet Android.
#
# Usa el mismo proyecto Android que las otras apps, pero lo propio de la cabina
# (guardar videos en la galería y el micrófono del libro de firmas) se agrega
# solo acá, al compilar: el proyecto del kiosco no cambia.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release donde se publica el APK (ej. video-v1)'
        required: false
        default: video-v1
      version_code:
        description: 'Número de versión (sube de a uno con cada versión nueva)'
        required: false
        default: '1'
      version_name:
        description: 'Nombre de la versión (ej. 1.0)'
        required: false
        default: '1.0'

permissions:
  contents: write

concurrency:
  group: video-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Capacitor 8 pide Node >= 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web de la cabina
        env:
          # El compilado necesita más memoria que los ~2 GB que Node usa por defecto
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Drive propio de la cabina (opcional: también se puede cargar en el panel)
          VITE_VIDEO_DRIVE_SCRIPT_URL: ${{ secrets.VITE_VIDEO_DRIVE_SCRIPT_URL }}
        run: |
          npx tsc -b
          npx vite build --config vite.video.config.ts
          rm -rf dist && mv dist-video dist

      - name: Sincronizar con Android
        run: |
          npx cap sync android
          # Los nombres con espacios rompen Gradle (igual que en build-mobile-apk.sh)
          find android -name '* *' -exec rm -rf {} + || true

      - name: Agregar lo nativo de la cabina (solo en este APK)
        run: |
          set -e
          # Plugin que guarda los videos en la galería del equipo
          mkdir -p android/app/src/main/java/com/eventpix/app/video
          cp native/video/VideoStoragePlugin.java android/app/src/main/java/com/eventpix/app/video/
          sed -i 's#registerPlugin(KioskLinkPlugin.class);#&\n        registerPlugin(com.eventpix.app.video.VideoStoragePlugin.class);#' \
            android/app/src/main/java/com/eventpix/app/MainActivity.java
          # Micrófono para el libro de firmas
          sed -i 's#<uses-permission android:name="android.permission.CAMERA" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' \
            android/app/src/main/AndroidManifest.xml
          # Si cambió el proyecto y no se pudo agregar, el APK no se arma a medias
          grep -q 'VideoStoragePlugin' android/app/src/main/java/com/eventpix/app/MainActivity.java
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Firma de debug fija de EventPix Video
        uses: actions/cache@v4
        with:
          path: video-debug.keystore
          key: video-debug-keystore-v1

      - name: Crear la firma si no existe
        run: |
          if [ ! -f video-debug.keystore ]; then
            keytool -genkeypair -keystore video-debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PeventpixAppId=com.eventpix.video \
            "-PeventpixAppLabel=EventPix Video" \
            -PeventpixDedicated=false \
            -PeventpixVersionCode=${{ inputs.version_code || '1' }} \
            -PeventpixVersionName=${{ inputs.version_name || '1.0' }} \
            -PeventpixDebugKeystore=$GITHUB_WORKSPACE/video-debug.keystore
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/eventpix-video.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eventpix-video
          path: eventpix-video.apk

      - name: Publicar en la release "${{ inputs.release || 'video-v1' }}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || 'video-v1' }}
        run: |
          gh release delete "$RELEASE" --yes --cleanup-tag || true
          gh release create "$RELEASE" eventpix-video.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "EventPix Video ($RELEASE)" \
            --notes "App de la cabina de video: 360, boomerang, cámara lenta, glam y libro de firmas (commit ${GITHUB_SHA::7}). Se instala como \"EventPix Video\", aparte del kiosco."
