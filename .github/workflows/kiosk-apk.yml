name: APK del kiosco

# Genera el APK de prueba del kiosco (VITE_APP_FLAVOR=kiosk) y lo publica en la
# release elegida (por defecto "kiosco-prueba"), con un link fijo para bajarlo desde la TV box.
# Solo a mano (Actions → "APK del kiosco" → Run workflow): para probar cambios
# alcanza con la versión web de Vercel; el APK hace falta para la impresión nativa.
#
# Las versiones (release "kiosco-vX.Y") se publican además en "kiosco-latest" con un
# kiosco-version.json (versión y huella SHA-256): de ahí se actualizan los equipos desde
# Ajustes → Equipo → Actualización.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release donde se publica el APK (ej. kiosco-prueba, kiosco-v2)'
        required: false
        default: kiosco-prueba

permissions:
  contents: write

concurrency:
  group: kiosk-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Capacitor 8 pide Node >= 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (variante kiosco)
        run: npm run build
        env:
          VITE_APP_FLAVOR: kiosk
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_KIOSK_DRIVE_SCRIPT_URL: ${{ secrets.VITE_KIOSK_DRIVE_SCRIPT_URL }}

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Quitar recursos que el kiosco no usa
        run: |
          ASSETS=android/app/src/main/assets/public
          rm -rf "$ASSETS/themes" "$ASSETS/edm-assets"
          find "$ASSETS" -maxdepth 1 -name '*.apk' -delete
          # Los nombres con espacios rompen Gradle (igual que en build-mobile-apk.sh)
          find android -name '* *' -exec rm -rf {} + || true

      - name: Firma del kiosco (secret KIOSK_KEYSTORE_B64)
        env:
          KIOSK_KEYSTORE_B64: ${{ secrets.KIOSK_KEYSTORE_B64 }}
        run: |
          # La firma vive en un secret del repo (no en la caché, que GitHub borra a los
          # 7 días sin uso). Con otra firma Android no deja instalar encima: los equipos
          # tendrían que desinstalar y perder los ajustes. Mejor que falle acá.
          if [ -z "$KIOSK_KEYSTORE_B64" ]; then
            echo "::error::Falta el secret KIOSK_KEYSTORE_B64 con la firma del kiosco"
            exit 1
          fi
          echo "$KIOSK_KEYSTORE_B64" | base64 -d > kiosk-debug.keystore
          EXPECTED="E7:7B:93:73:C7:EF:B3:E4:F2:0D:B5:5D:FE:5A:BF:77:2E:B0:43:65:C4:13:DD:B3:DB:E3:4A:30:50:DF:6F:82"
          ACTUAL=$(keytool -list -v -keystore kiosk-debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA256: *//p' | tr -d '[:space:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::La firma del secret no es la de siempre ($ACTUAL)"
            exit 1
          fi

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PeventpixAppId=com.eventpix.kiosk \
            "-PeventpixAppLabel=EventPix Kiosco" \
            -PeventpixDebugKeystore=$GITHUB_WORKSPACE/kiosk-debug.keystore
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/eventpix-kiosco.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eventpix-kiosco
          path: eventpix-kiosco.apk

      - name: Publicar en la release "${{ inputs.release || 'kiosco-prueba' }}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || 'kiosco-prueba' }}
        run: |
          gh release delete "$RELEASE" --yes --cleanup-tag || true
          gh release create "$RELEASE" eventpix-kiosco.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Kiosco ($RELEASE)" \
            --notes "APK del kiosco (commit ${GITHUB_SHA::7}). Se instala como \"EventPix Kiosco\" y se actualiza encima de la versión anterior sin perder los ajustes."

      - name: Publicar para los equipos (kiosco-latest)
        if: startsWith(inputs.release, 'kiosco-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GRADLE=android/app/build.gradle
          CODE=$(sed -n "s/.*eventpixVersionCode') ?: \"\([0-9]*\)\".*/\1/p" $GRADLE)
          NAME=$(sed -n "s/.*eventpixVersionName') ?: \"\([^\"]*\)\".*/\1/p" $GRADLE)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then echo "::error::No se encontró la versión en $GRADLE"; exit 1; fi
          SHA=$(sha256sum eventpix-kiosco.apk | cut -d' ' -f1)
          jq -n --argjson code "$CODE" --arg name "$NAME" --arg sha "$SHA" \
            --argjson size "$(stat -c %s eventpix-kiosco.apk)" --arg commit "$GITHUB_SHA" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/kiosco-latest/eventpix-kiosco.apk" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, sha256: $sha, size: $size, commit: $commit, publishedAt: (now | todate)}' \
            > kiosco-version.json
          cat kiosco-version.json
          gh release view kiosco-latest >/dev/null 2>&1 || gh release create kiosco-latest \
            --prerelease --target "$GITHUB_SHA" --title "Kiosco (última versión)" \
            --notes "Última versión del kiosco. Los equipos se actualizan desde Ajustes → Equipo → Actualización."
          # Primero el APK y después el json: un equipo nunca ve una versión sin su APK
          gh release upload kiosco-latest eventpix-kiosco.apk --clobber
          gh release upload kiosco-latest kiosco-version.json --clobber
