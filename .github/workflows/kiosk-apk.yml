name: APK del kiosco

# Genera el APK de prueba del kiosco (VITE_APP_FLAVOR=kiosk) y lo publica en la
# release "kiosco-prueba", con un link fijo para bajarlo desde la TV box.
on:
  push:
    branches: [claude/apk-reverse-engineering-ulzqm9]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kiosk-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiosk-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (variante kiosco)
        run: npm run build
        env:
          VITE_APP_FLAVOR: kiosk
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Quitar recursos que el kiosco no usa
        run: |
          ASSETS=android/app/src/main/assets/public
          rm -rf "$ASSETS/themes" "$ASSETS/edm-assets"
          find "$ASSETS" -maxdepth 1 -name '*.apk' -delete
          # Los nombres con espacios rompen Gradle (igual que en build-mobile-apk.sh)
          find android -name '* *' -exec rm -rf {} + || true

      - name: Firma de debug fija
        uses: actions/cache@v4
        with:
          path: kiosk-debug.keystore
          key: kiosk-debug-keystore-v1

      - name: Crear la firma si no existe
        run: |
          if [ ! -f kiosk-debug.keystore ]; then
            keytool -genkeypair -keystore kiosk-debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PeventpixAppId=com.eventpix.kiosk \
            "-PeventpixAppLabel=EventPix Kiosco" \
            -PeventpixDebugKeystore=$GITHUB_WORKSPACE/kiosk-debug.keystore
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/eventpix-kiosco.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eventpix-kiosco
          path: eventpix-kiosco.apk

      - name: Publicar en la release "kiosco-prueba"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kiosco-prueba --yes --cleanup-tag || true
          gh release create kiosco-prueba eventpix-kiosco.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Kiosco de prueba" \
            --notes "APK de prueba del kiosco (commit ${GITHUB_SHA::7}). Se instala al lado de la app de TV como \"EventPix Kiosco\"."
