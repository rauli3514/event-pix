name: APK de la TV

# Compila la app Android de las pantallas (android-tv-player).
# - En cada push o PR que toque android-tv-player/: compila y deja el APK como
#   artefacto del run (sirve para verificar que el código compila).
# - A mano (Actions → "APK de la TV" → Run workflow): además lo publica en la
#   release elegida (por defecto "tv-prueba"), con un link fijo para bajarlo.
on:
  push:
    paths:
      - 'android-tv-player/**'
      - '.github/workflows/tv-apk.yml'
  pull_request:
    paths:
      - 'android-tv-player/**'
      - '.github/workflows/tv-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release donde se publica el APK (ej. tv-prueba, tv-v2.1)'
        required: false
        default: tv-prueba

permissions:
  contents: write

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # AGP 8.5

      - name: Firma de debug fija
        uses: actions/cache@v4
        with:
          path: tv-debug.keystore
          key: tv-debug-keystore-v1

      # Siempre la misma firma: cada APK de CI se instala encima del anterior
      # sin perder el código de la pantalla ni sus ajustes.
      - name: Crear la firma si no existe
        run: |
          if [ ! -f tv-debug.keystore ]; then
            keytool -genkeypair -keystore tv-debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp tv-debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android-tv-player
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/eventpix-tv.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: eventpix-tv-${{ env.VERSION }}
          path: eventpix-tv.apk

      - name: Publicar en la release "${{ inputs.release || 'tv-prueba' }}"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || 'tv-prueba' }}
        run: |
          gh release delete "$RELEASE" --yes --cleanup-tag || true
          gh release create "$RELEASE" eventpix-tv.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "App TV $VERSION ($RELEASE)" \
            --notes "APK de las pantallas EventPix TV $VERSION (commit ${GITHUB_SHA::7}). Los APK compilados por este workflow tienen siempre la misma firma y se instalan uno encima del otro."
