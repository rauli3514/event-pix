name: APK de la TV

# Compila la app Android de las pantallas (android-tv-player).
# - Push o PR que toque android-tv-player/: compila y deja el APK como artefacto
#   (sirve para verificar que el código compila).
# - Push a main (o a mano, Run workflow): además lo publica en la release fija
#   "tv-latest" con tv-version.json. Las TVs lo leen para ofrecer "Actualizar"
#   desde su menú o desde el panel (sin pendrive).
# - Semanal: mantiene viva la firma en la caché de GitHub (si la caché se
#   borrara, la firma cambiaría y las TVs no aceptarían la actualización).
on:
  push:
    paths:
      - 'android-tv-player/**'
      - '.github/workflows/tv-apk.yml'
  pull_request:
    paths:
      - 'android-tv-player/**'
      - '.github/workflows/tv-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # lunes 06:17 UTC

permissions:
  contents: write

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: tv-latest

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Tocar la caché de la firma (evita que GitHub la borre por inactividad)
        uses: actions/cache/restore@v4
        with:
          path: tv-debug.keystore
          key: tv-debug-keystore-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # AGP 8.5

      - name: Firma fija
        uses: actions/cache@v4
        with:
          path: tv-debug.keystore
          key: tv-debug-keystore-v1

      # Siempre la misma firma: cada APK se instala encima del anterior sin
      # perder el código de la pantalla ni sus ajustes.
      - name: Crear la firma si no existe
        run: |
          if [ ! -f tv-debug.keystore ]; then
            echo "::warning::No había firma en caché: se crea una nueva. Las TVs con un APK firmado con otra clave necesitan reinstalarlo a mano una vez."
            keytool -genkeypair -keystore tv-debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp tv-debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android-tv-player
        run: |
          chmod +x gradlew
          # lintDebug: funciones de Android que no existen en equipos viejos (NewApi).
          ./gradlew lintDebug assembleDebug --no-daemon --stacktrace -PtvBuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/eventpix-tv.apk"
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.2.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Reporte de lint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-tv-player/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: eventpix-tv-${{ env.VERSION_NAME }}
          path: eventpix-tv.apk

      - name: Publicar en la release "tv-latest"
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(sha256sum eventpix-tv.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s eventpix-tv.apk)
          cat > tv-version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/eventpix-tv.apk",
            "sha256": "$SHA256",
            "size": $SIZE,
            "commit": "${GITHUB_SHA::7}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat tv-version.json

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "App TV" --notes "Última versión de la app de las pantallas." --target "$GITHUB_SHA"
          fi
          # Primero el APK y después el JSON: una TV nunca ve una versión nueva
          # cuyo APK todavía no está subido.
          gh release upload "$RELEASE_TAG" eventpix-tv.apk --clobber
          gh release upload "$RELEASE_TAG" tv-version.json --clobber
          gh release edit "$RELEASE_TAG" --title "App TV $VERSION_NAME" \
            --notes "Última versión de la app de las pantallas: $VERSION_NAME (versionCode $VERSION_CODE, commit ${GITHUB_SHA::7}). Las TVs la instalan desde Menú → Actualizar app, o desde el panel."
